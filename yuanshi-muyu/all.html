<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>全部商品 · 木语家居 | 24002120311 李兴达</title>
<link rel="stylesheet" href="css/lixingda.css">
<link rel="stylesheet" href="css/lxd_admin.css">
</head>
<body>
<main class="li-page" style="padding-bottom:76px">
  <!-- 标题 -->
  <header class="li-topbar">
    <button class="li-back" data-back>&#8592;</button>
    <h1>全部商品</h1>
    <a class="li-side" href="search.html" title="搜索"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
  </header>

  <div class="li-container">
    <!-- 搜索栏 -->
    <div class="li-allsearch">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8a8276" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="liAllSearch" type="text" placeholder="请输入搜索的商品" style="border:none;flex:1;font-size:13px;background:transparent;color:#3d3a34">
    </div>

    <!-- 排序条 -->
    <div class="li-sortbar">
      <button data-sort="default" class="li-on">综合</button>
      <button data-sort="sales">销量</button>
      <button data-sort="new">新品</button>
      <button data-sort="price">价格</button>
      <button class="li-filter" id="liFilterBtn">&#9881; 筛选<i class="li-fcount li-hidden" id="liFCount">0</i></button>
    </div>

    <!-- 商品列表 -->
    <div class="li-loader" id="liLoader"><div class="li-spinner"></div></div>
    <div id="liList"></div>
    <div class="li-pager" id="liPager"></div>
    <div class="li-empty li-hidden" id="liEmpty">
      <div class="li-ico">&#128269;</div>
      <p>没有找到相关商品</p>
    </div>
  </div>
</main>

<!-- 筛选弹层 -->
<div class="li-filter-mask li-hidden" id="liFilterMask"></div>
<div class="li-filter-panel li-hidden" id="liFilterPanel">
  <div class="li-filter-title">筛选</div>

  <div class="li-filter-group">
    <h4>商品分类</h4>
    <div class="li-filter-options" id="liFCat">
      <span class="li-filter-opt" data-cat="all" data-group="cat">全部</span>
      <span class="li-filter-opt" data-cat="living" data-group="cat">客厅系列</span>
      <span class="li-filter-opt" data-cat="bedroom" data-group="cat">卧室系列</span>
      <span class="li-filter-opt" data-cat="dining" data-group="cat">餐厅系列</span>
      <span class="li-filter-opt" data-cat="office" data-group="cat">办公系列</span>
    </div>
  </div>

  <div class="li-filter-group">
    <h4>价格区间</h4>
    <div class="li-filter-options" id="liFPrice">
      <span class="li-filter-opt" data-price="all" data-group="price">全部</span>
      <span class="li-filter-opt" data-price="0-1000" data-group="price">¥1000以下</span>
      <span class="li-filter-opt" data-price="1000-3000" data-group="price">¥1000-3000</span>
      <span class="li-filter-opt" data-price="3000-5000" data-group="price">¥3000-5000</span>
      <span class="li-filter-opt" data-price="5000+" data-group="price">¥5000以上</span>
    </div>
  </div>

  <div class="li-filter-group">
    <h4>促销标签</h4>
    <div class="li-filter-options" id="liFTag">
      <span class="li-filter-opt" data-tag="all" data-group="tag">全部</span>
      <span class="li-filter-opt" data-tag="hot" data-group="tag">热卖</span>
      <span class="li-filter-opt" data-tag="new" data-group="tag">新品</span>
      <span class="li-filter-opt" data-tag="suite" data-group="tag">套装</span>
      <span class="li-filter-opt" data-tag="hit" data-group="tag">爆款</span>
    </div>
  </div>

  <div class="li-filter-foot">
    <button class="li-btn li-ghost" id="liFilterReset">重置</button>
    <button class="li-btn" id="liFilterOk">确定</button>
  </div>
</div>

<!-- 5 底部导航 -->
<nav class="li-tab5">
  <a href="index.html" data-tab="home"><span class="li-ico"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 3 4 10.5h1.8V20h12.4v-9.5H20L12 3z M10.3 14.5h3.4V20h-3.4z" fill="currentColor"/></svg></span>首页</a>
  <a href="all.html" data-tab="all" class="li-on"><span class="li-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="16" rx="3.5"/><path d="M9 13.5c.8 1.3 1.8 2 3 2s2.2-.7 3-2"/></svg></span>全部商品</a>
  <a href="list.html" data-tab="cat"><span class="li-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M13 14h7M13 18h7"/></svg></span>分类</a>
  <a href="cart.html" data-tab="cart"><span class="li-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2.2l2.2 11.5h9.7L20 8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg></span>购物车<span class="li-tab-badge"></span></a>
  <a href="profile.html" data-tab="user"><span class="li-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c.6-3.8 3.8-6 7.5-6s6.9 2.2 7.5 6"/></svg></span>个人中心</a>
</nav>

<script src="js/app.js"></script>
<script>
(function () {
  let all = [], keyword = '', sort = 'default';
  let page = 1, size = 8;
  let filter = { cat: 'all', price: 'all', tag: 'all' }; // 当前生效筛选
  let draft = { cat: 'all', price: 'all', tag: 'all' };  // 面板中的草稿

  // 通过接口加载全部商品（接口不可用时自动回退本地 JSON）
  LI.getProducts().then(function (list) {
    all = list;
    document.getElementById('liLoader').classList.add('li-hidden');
    render();
  }).catch(function (err) {
    console.error('[all.html] 商品加载失败', err);
    document.getElementById('liList').innerHTML = '<div class="li-empty"><p>数据加载失败</p></div>';
  });

  // 过滤 + 排序 + 客户端分页，渲染商品行与分页条
  function render() {
    let shown = all.slice();
    // 关键词
    if (keyword) {
      shown = shown.filter(function (p) { return (p.name + p.sub + p.desc).indexOf(keyword) > -1; });
    }
    // 分类筛选
    if (filter.cat !== 'all') {
      shown = shown.filter(function (p) { return p.cat === filter.cat; });
    }
    // 价格筛选
    if (filter.price !== 'all') {
      shown = shown.filter(function (p) {
        if (filter.price === '0-1000') return p.price < 1000;
        if (filter.price === '1000-3000') return p.price >= 1000 && p.price < 3000;
        if (filter.price === '3000-5000') return p.price >= 3000 && p.price < 5000;
        if (filter.price === '5000+') return p.price >= 5000;
        return true;
      });
    }
    // 标签筛选
    if (filter.tag !== 'all') {
      shown = shown.filter(function (p) {
        var t = p.tag || '';
        if (filter.tag === 'hot') return t.indexOf('热卖') > -1;
        if (filter.tag === 'new') return t.indexOf('新品') > -1;
        if (filter.tag === 'suite') return t.indexOf('套装') > -1;
        if (filter.tag === 'hit') return t.indexOf('爆款') > -1;
        return true;
      });
    }
    // 排序
    if (sort === 'sales') shown.sort(function (a, b) { return b.sales - a.sales; });
    else if (sort === 'new') shown.sort(function (a, b) { return Number(b.id) - Number(a.id) || String(b.id).localeCompare(String(a.id)); });
    else if (sort === 'price') shown.sort(function (a, b) { return a.price - b.price; });

    const total = shown.length;
    const totalPages = Math.max(1, Math.ceil(total / size));
    if (page > totalPages) page = totalPages;
    const paged = shown.slice((page - 1) * size, page * size);

    const box = document.getElementById('liList');
    const empty = document.getElementById('liEmpty');
    const pager = document.getElementById('liPager');
    if (!total) { box.innerHTML = ''; pager.innerHTML = ''; empty.classList.remove('li-hidden'); return; }
    empty.classList.add('li-hidden');
    box.innerHTML = paged.map(LI.listRow).join('');
    LI.renderPager(pager, { total: total, list: paged, page: page, size: size }, function (next) {
      page = next;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // 排序切换
  document.querySelectorAll('.li-sortbar button[data-sort]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.li-sortbar button[data-sort]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      sort = b.dataset.sort;
      page = 1;
      render();
    });
  });

  // 搜索
  document.getElementById('liAllSearch').addEventListener('input', function () {
    keyword = this.value.trim();
    page = 1;
    render();
  });

  /* ===== 筛选面板 ===== */
  var mask = document.getElementById('liFilterMask');
  var panel = document.getElementById('liFilterPanel');
  var fcount = document.getElementById('liFCount');

  // 打开面板
  document.getElementById('liFilterBtn').addEventListener('click', function () {
    // 草稿同步当前生效筛选
    draft = { cat: filter.cat, price: filter.price, tag: filter.tag };
    // 高亮面板选项
    document.querySelectorAll('#liFilterPanel .li-filter-opt').forEach(function (o) {
      var g = o.dataset.group;
      var v = o.dataset[g]; // cat/price/tag
      o.classList.toggle('on', draft[g] === v);
    });
    mask.classList.remove('li-hidden');
    panel.classList.remove('li-hidden');
  });

  // 点击选项（仅高亮草稿）
  document.querySelectorAll('#liFilterPanel .li-filter-opt').forEach(function (o) {
    o.addEventListener('click', function () {
      var g = o.dataset.group;
      var v = o.dataset[g];
      draft[g] = v;
      document.querySelectorAll('#liFilterPanel .li-filter-opt[data-group="' + g + '"]').forEach(function (x) {
        x.classList.toggle('on', x === o);
      });
    });
  });

  // 关闭（点遮罩）
  mask.addEventListener('click', function () {
    mask.classList.add('li-hidden'); panel.classList.add('li-hidden');
  });

  // 重置
  document.getElementById('liFilterReset').addEventListener('click', function () {
    draft = { cat: 'all', price: 'all', tag: 'all' };
    document.querySelectorAll('#liFilterPanel .li-filter-opt').forEach(function (o) {
      o.classList.toggle('on', draft[o.dataset.group] === o.dataset[o.dataset.group]);
    });
  });

  // 确定：应用筛选
  document.getElementById('liFilterOk').addEventListener('click', function () {
    filter = { cat: draft.cat, price: draft.price, tag: draft.tag };
    // 更新筛选按钮角标
    var n = (filter.cat !== 'all' ? 1 : 0) + (filter.price !== 'all' ? 1 : 0) + (filter.tag !== 'all' ? 1 : 0);
    if (n > 0) { fcount.textContent = n; fcount.classList.remove('li-hidden'); }
    else fcount.classList.add('li-hidden');
    mask.classList.add('li-hidden'); panel.classList.add('li-hidden');
    page = 1;
    render();
    LI.toast('已筛选出 ' + (all.filter(function(p){ return passes(p); }).length) + ' 件商品');
  });

  // 计算过滤后的数量（供 toast）
  function passes(p) {
    if (filter.cat !== 'all' && p.cat !== filter.cat) return false;
    if (filter.price === '0-1000' && p.price >= 1000) return false;
    if (filter.price === '1000-3000' && !(p.price >= 1000 && p.price < 3000)) return false;
    if (filter.price === '3000-5000' && !(p.price >= 3000 && p.price < 5000)) return false;
    if (filter.price === '5000+' && p.price < 5000) return false;
    if (filter.tag === 'hot' && (p.tag || '').indexOf('热卖') === -1) return false;
    if (filter.tag === 'new' && (p.tag || '').indexOf('新品') === -1) return false;
    if (filter.tag === 'suite' && (p.tag || '').indexOf('套装') === -1) return false;
    if (filter.tag === 'hit' && (p.tag || '').indexOf('爆款') === -1) return false;
    return true;
  }
})();
</script>
</body>
</html>
