<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>商品分类 · 木语家居 | 24002120311 李兴达</title>
<link rel="stylesheet" href="css/lixingda.css">
<link rel="stylesheet" href="css/lxd_admin.css">
</head>
<body>
<main class="li-page">
  <header class="li-topbar">
    <button class="li-back" data-back>&#8592;</button>
    <h1 id="liCatTitle">商品分类</h1>
    <a class="li-side" href="search.html" title="搜索"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
  </header>

  <div class="li-container">
    <div class="li-list-wrap">
      <!-- 侧栏分类 -->
      <nav class="li-cats" id="liCats"></nav>
      <!-- 内容 -->
      <div class="li-list-main">
        <div class="li-sec" style="margin-top:10px">
          <h2 id="liCount">共 0 件</h2>
          <select id="liSort" style="border:1px solid #e8e0d2;border-radius:8px;padding:5px 8px;font-size:12px;background:#fff">
            <option value="default">综合</option>
            <option value="hot">销量</option>
            <option value="priceUp">价格↑</option>
            <option value="priceDown">价格↓</option>
          </select>
        </div>
        <div class="li-loader" id="liLoader"><div class="li-spinner"></div></div>
        <div class="li-prod-grid" id="liGrid"></div>
        <div class="li-pager" id="liPager"></div>
      </div>
    </div>
  </div>
</main>

<nav class="li-tab5">
  <a href="index.html" data-tab="home" class=""><span class="li-ico"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 3 4 10.5h1.8V20h12.4v-9.5H20L12 3z M10.3 14.5h3.4V20h-3.4z" fill="currentColor"/></svg></span>首页</a>
  <a href="all.html" data-tab="all" class=""><span class="li-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="16" rx="3.5"/><path d="M9 13.5c.8 1.3 1.8 2 3 2s2.2-.7 3-2"/></svg></span>全部商品</a>
  <a href="list.html" data-tab="cat" class="li-on"><span class="li-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M13 14h7M13 18h7"/></svg></span>分类</a>
  <a href="cart.html" data-tab="cart" class=""><span class="li-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2.2l2.2 11.5h9.7L20 8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg></span>购物车<span class="li-tab-badge"></span></a>
  <a href="profile.html" data-tab="user" class=""><span class="li-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c.6-3.8 3.8-6 7.5-6s6.9 2.2 7.5 6"/></svg></span>个人中心</a>
</nav>

<script src="js/app.js"></script>
<script>
(function () {
  LI.setTab('list');
  const params = new URLSearchParams(location.search);
  let curCat = params.get('cat') || 'living';
  let cats = [];
  let page = 1;
  let sort = 'default';

  // 取分类的业务标识（接口返回 key，本地 JSON 从 link 中解析）
  function categoryKey(category) {
    if (category.key) return category.key;
    const link = category.link || '';
    const hit = String(link).match(/cat=([^&]+)/);
    if (hit) return decodeURIComponent(hit[1]);
    return String(category.id);
  }

  // 顶部标题与侧栏分类渲染
  function renderCats() {
    const selected = cats.find(function (c) { return categoryKey(c) === curCat; }) || cats[0];
    if (selected) curCat = categoryKey(selected);
    document.getElementById('liCatTitle').textContent = selected ? selected.name : '商品分类';
    document.getElementById('liCats').innerHTML = cats.map(function (c) {
      const key = categoryKey(c);
      return '<a href="list.html?cat=' + encodeURIComponent(key) + '" class="' + (key === curCat ? 'li-on' : '') + '">' + c.name + '</a>';
    }).join('');
  }

  // 按分类分页加载商品，渲染卡片与分页条
  function loadProducts() {
    document.getElementById('liLoader').classList.remove('li-hidden');
    LI.queryProducts({ cat: curCat, page: page, size: 8, sort: sort }).then(function (data) {
      const shown = data.list;
      document.getElementById('liCount').textContent = '共 ' + data.total + ' 件';
      document.getElementById('liLoader').classList.add('li-hidden');
      document.getElementById('liGrid').innerHTML = shown.length
        ? shown.map(LI.prodCard).join('')
        : '<div class="li-empty"><p>当前分类暂无商品</p></div>';
      shown.forEach(function (p) { LI.refreshFavBtn(p.id); });
      LI.renderPager(document.getElementById('liPager'), data, function (next) {
        page = next;
        loadProducts();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }).catch(function (err) {
      console.error('[list.html] 商品加载失败', err);
      document.getElementById('liLoader').classList.add('li-hidden');
      document.getElementById('liGrid').innerHTML = '<div class="li-empty"><p>数据加载失败</p></div>';
    });
  }

  // 初始化：先加载分类，再加载当前分类商品
  LI.getCategories().then(function (list) {
    cats = list || [];
    renderCats();
    loadProducts();
  }).catch(function (err) {
    console.error('[list.html] 分类加载失败', err);
    document.getElementById('liLoader').classList.add('li-hidden');
    document.getElementById('liGrid').innerHTML = '<div class="li-empty"><p>数据加载失败</p></div>';
  });

  // 切换排序时回到第一页重新查询
  document.getElementById('liSort').addEventListener('change', function () {
    sort = this.value;
    page = 1;
    loadProducts();
  });
})();
</script>
</body>
</html>
