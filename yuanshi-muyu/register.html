<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>注册 · 木语家居 | 24002120311 李兴达</title>
<link rel="stylesheet" href="css/lixingda.css">
<style>
  .li-auth-page { display: flex; flex-direction: column; justify-content: center; min-height: 100vh; background: linear-gradient(160deg, #f7f3ec, #efe7da); }
  .li-auth-logo { text-align: center; margin-bottom: 24px; }
  .li-auth-logo img { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 10px; box-shadow: 0 10px 24px rgba(120,90,50,.2); }
  .li-auth-logo h1 { font-size: 20px; color: #6f5636; }
  .li-auth-card { background: #fff; border-radius: 18px; padding: 24px 22px; box-shadow: 0 12px 32px rgba(120,90,50,.12); }
</style>
</head>
<body>
<div class="li-auth-page">
  <div class="li-container">
    <div class="li-auth-logo">
      <img src="img/products.png" alt="木语家居">
      <h1>注册木语会员</h1>
      <p>加入我们，享受原木品质生活</p>
    </div>

    <div class="li-auth-card">
      <form class="li-form" id="liRegForm">
        <div class="li-field">
          <label>手机号</label>
          <input type="tel" id="liRegPhone" placeholder="请输入11位手机号" required>
        </div>
        <div class="li-field">
          <label>昵称</label>
          <input type="text" id="liRegNick" placeholder="给自己起个昵称" required>
        </div>
        <div class="li-field">
          <label>密码</label>
          <input type="password" id="liRegPwd" placeholder="6-20位密码" required>
        </div>
        <div class="li-field">
          <label>确认密码</label>
          <input type="password" id="liRegPwd2" placeholder="再次输入密码" required>
        </div>
        <button type="submit" class="li-btn li-block">注 册</button>
      </form>
      <div class="li-link">已有账号？<a href="login.html">去登录</a></div>
      <div class="li-link"><a href="index.html" style="font-weight:400">返回首页</a></div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
(function () {
  document.getElementById('liRegForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const phone = document.getElementById('liRegPhone').value.trim();
    const nick = document.getElementById('liRegNick').value.trim();
    const pwd = document.getElementById('liRegPwd').value;
    const pwd2 = document.getElementById('liRegPwd2').value;

    if (!/^1\d{10}$/.test(phone)) { LI.toast('请输入正确的11位手机号'); return; }
    if (pwd.length < 6) { LI.toast('密码至少6位'); return; }
    if (pwd !== pwd2) { LI.toast('两次密码不一致'); return; }

    // 优先调用后端注册接口；网络不可用时回退本地存储，保证纯静态页面可用
    LI.request('/user/register', { method: 'POST', body: { username: phone, password: pwd, nickname: nick } })
      .then(function () {
        LI.toast('注册成功，请登录');
        setTimeout(function () { location.href = 'login.html'; }, 800);
      })
      .catch(function (err) {
        console.error('[register.html] 注册失败', err);
        if (!err.network) { LI.toast(err.message || '注册失败'); return; }
        const users = LI.load('li_users', []);
        if (users.some(function (u) { return u.phone === phone; })) { LI.toast('该手机号已注册'); return; }
        users.push({ account: phone, phone: phone, pwd: pwd, nick: nick, level: '新会员', points: 100, orderCount: 0 });
        LI.save('li_users', users);
        LI.toast('注册成功（离线模式），请登录');
        setTimeout(function () { location.href = 'login.html'; }, 800);
      });
  });
})();
</script>
</body>
</html>
