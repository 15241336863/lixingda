<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>木语家居 · 首页 | 24002120311 李兴达</title>
<link rel="stylesheet" href="css/lixingda.css">
</head>
<body>
<!-- 页面主体 -->
<main class="li-page">
  <!-- 顶部栏 -->
  <header class="li-topbar">
    <div></div>
    <h1>木语家居</h1>
    <a class="li-side" href="search.html" title="搜索"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
  </header>

  <!-- 搜索框 -->
  <div class="li-container">
    <a href="search.html" class="li-search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8a8276" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span>搜索沙发、餐桌、衣柜…</span>
    </a>

    <!-- 轮播 -->
    <div class="li-swiper" id="liSwiper">
      <div class="li-swiper-track" id="liSwiperTrack"></div>
      <div class="li-dots" id="liDots"></div>
    </div>

    <!-- 金刚区分类 -->
    <nav class="li-grid-nav" id="liGridNav"></nav>

    <!-- 热卖精选 -->
    <div class="li-sec"><h2>热卖精选</h2><a href="list.html?sort=hot">更多 &rsaquo;</a></div>
    <div class="li-prod-grid" id="liHot"></div>

    <!-- 新品推荐 -->
    <div class="li-sec"><h2>新品推荐</h2><a href="list.html?sort=new">更多 &rsaquo;</a></div>
    <div class="li-prod-grid" id="liNew"></div>

    <!-- 口碑评价 -->
    <div class="li-sec"><h2>用户口碑</h2></div>
    <div id="liReviews"></div>
  </div>
</main>

<!-- 底部 Tab -->
<nav class="li-tab5">
  <a href="index.html" data-tab="home" class="li-on"><span class="li-ico"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 3 4 10.5h1.8V20h12.4v-9.5H20L12 3z M10.3 14.5h3.4V20h-3.4z" fill="currentColor"/></svg></span>首页</a>
  <a href="all.html" data-tab="all"><span class="li-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="16" rx="3.5"/><path d="M9 13.5c.8 1.3 1.8 2 3 2s2.2-.7 3-2"/></svg></span>全部商品</a>
  <a href="list.html" data-tab="cat"><span class="li-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M13 14h7M13 18h7"/></svg></span>分类</a>
  <a href="cart.html" data-tab="cart"><span class="li-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2.2l2.2 11.5h9.7L20 8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg></span>购物车<span class="li-tab-badge"></span></a>
  <a href="profile.html" data-tab="user"><span class="li-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c.6-3.8 3.8-6 7.5-6s6.9 2.2 7.5 6"/></svg></span>个人中心</a>
</nav>

<script src="js/app.js"></script>
<script>
/* 首页专用脚本 */
(function () {
  LI.setTab('home');
  const track = document.getElementById('liSwiperTrack');
  const dots = document.getElementById('liDots');
  let cur = 0, timer = null;

  // 1) 轮播数据（fetch）
  LI.getBanners().then(function (banners) {
    track.innerHTML = banners.map(function (b) {
      return '<div class="li-slide"><a href="' + b.link + '"><img src="img/' + b.img + '" alt="' + b.title + '">' +
        '<div class="li-slide-cap"><h3>' + b.title + '</h3><p>' + b.sub + '</p></div></a></div>';
    }).join('');
    dots.innerHTML = banners.map(function (_, i) { return '<i class="' + (i === 0 ? 'on' : '') + '"></i>'; }).join('');
    goTo(0);
    timer = setInterval(function () { cur = (cur + 1) % banners.length; goTo(cur); }, 3500);
    // 手势滑动
    let sx = 0;
    track.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; clearInterval(timer); });
    track.addEventListener('touchend', function (e) {
      const dx = e.changedTouches[0].clientX - sx;
      if (Math.abs(dx) > 40) { cur = dx < 0 ? (cur + 1) % banners.length : (cur - 1 + banners.length) % banners.length; }
      goTo(cur);
      timer = setInterval(function () { cur = (cur + 1) % banners.length; goTo(cur); }, 3500);
    });
  }).catch(() => { track.innerHTML = '<div class="li-empty"><p>轮播加载失败</p></div>'; });

  function goTo(i) {
    cur = i;
    track.style.transform = 'translateX(-' + (i * 100) + '%)';
    [...dots.children].forEach(function (d, k) { d.classList.toggle('on', k === i); });
  }

  // 2) 金刚区分类（fetch）
  LI.getCategories().then(function (cats) {
    const allEntry = '<a href="all.html"><img class="li-ico" src="img/products.png" alt="全部商品"><span>全部商品</span></a>';
    document.getElementById('liGridNav').innerHTML = allEntry + cats.map(function (c) {
      return '<a href="' + c.link + '"><img class="li-ico" src="img/' + c.icon + '" alt="' + c.name + '"><span>' + c.name + '</span></a>';
    }).join('');
  }).catch(() => {});

  // 3) 热卖 / 新品（接口分页参数：sort=hot / sort=new）
  Promise.all([
    LI.queryProducts({ sort: 'hot', page: 1, size: 4 }),
    LI.queryProducts({ sort: 'new', page: 1, size: 4 })
  ]).then(function (res) {
    const hot = res[0].list;
    const fresh = res[1].list;
    document.getElementById('liHot').innerHTML = hot.map(LI.prodCard).join('');
    document.getElementById('liNew').innerHTML = fresh.map(LI.prodCard).join('');
    // 初始化收藏态
    hot.concat(fresh).forEach(function (p) { LI.refreshFavBtn(p.id); });
  }).catch(function (err) {
    console.error('[index.html] 推荐商品加载失败', err);
  });

  // 4) 口碑评价（fetch）
  LI.getReviews().then(function (revs) {
    document.getElementById('liReviews').innerHTML = revs.slice(0, 3).map(function (r) {
      const stars = '★★★★★'.slice(0, r.rate) + '☆☆☆☆☆'.slice(0, 5 - r.rate);
      return '<div class="li-card" style="padding:12px;margin-bottom:10px">' +
        '<div style="font-size:13px;font-weight:600">' + r.user +
        '<span style="color:#e0a53a;font-size:12px;float:right">' + stars + '</span></div>' +
        '<div style="font-size:12px;color:#8a8276;margin:4px 0">' + r.product + '</div>' +
        '<div style="font-size:13px;color:#3d3a34">' + r.text + '</div>' +
        '<div style="font-size:11px;color:#b0a896;margin-top:6px">' + r.time + '</div></div>';
    }).join('');
  }).catch(() => {});
})();
</script>
</body>
</html>
