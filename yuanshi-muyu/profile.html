<script src="js/app.js"></script>
<script>
(function () {
  function refresh() {
    document.getElementById('liCartN').textContent = LI.cartCount();
    document.getElementById('liFavN').textContent = LI.fav.length;

    const login = LI.isLogin();
    const box = document.getElementById('liAuthBox');
    if (login) {
      const u = JSON.parse(localStorage.getItem(LI.userKey));
      document.getElementById('liNick').textContent = u.nick || '用户';
      document.getElementById('liLevel').textContent = (u.level || '') + ' · ' + (u.points || 0) + ' 积分';
      document.getElementById('liOrders').textContent = u.orderCount || 0;
      box.innerHTML = '<button class="li-btn li-block" id="liLogout">退出登录</button>';
      document.getElementById('liLogout').addEventListener('click', function () {
        LI.logout(); refresh(); LI.toast('已退出登录');
      });
    } else {
      document.getElementById('liNick').textContent = '未登录';
      document.getElementById('liLevel').textContent = '点击登录 / 注册';
      document.getElementById('liOrders').textContent = '0';
      box.innerHTML = '<div style="display:flex;gap:10px">' +
        '<a class="li-btn li-ghost li-block" href="login.html">登录</a>' +
        '<a class="li-btn li-block" href="register.html">注册</a></div>';
    }
  }
  refresh();

  // 客服按钮
  document.getElementById('liCSBtn').addEventListener('click', function () {
    LI.initCS();
    var f = document.getElementById('liCSFloat');
    if (f) f.click();
  });
})();
</script>
