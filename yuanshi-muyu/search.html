<body>
<main class="li-page">
  <header class="li-topbar">
    <button class="li-back" data-back>&#8592;</button>
    <h1>搜索</h1>
    <div></div>
  </header>

  <div class="li-container">
    <div class="li-search" style="margin-top:10px">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8a8276" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="liSearchInput" type="text" placeholder="搜索沙发、餐桌、衣柜…"
        style="border:none;flex:1;font-size:14px;background:transparent;color:#3d3a34">
    </div>

    <div class="li-sec"><h2>热门搜索</h2></div>
    <div id="liHotWords" style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="li-btn li-ghost" data-word="沙发">沙发</button>
      <button class="li-btn li-ghost" data-word="餐桌">餐桌</button>
      <button class="li-btn li-ghost" data-word="衣柜">衣柜</button>
      <button class="li-btn li-ghost" data-word="办公椅">办公椅</button>
    </div>

    <div class="li-sec"><h2>搜索结果</h2></div>
    <div class="li-loader li-hidden" id="liLoader"><div class="li-spinner"></div></div>
    <div class="li-prod-grid" id="liResult"></div>
    <div class="li-pager" id="liPager"></div>
    <div class="li-empty li-hidden" id="liNoResult"><p>没有找到相关商品</p></div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
(function () {
  const input = document.getElementById('liSearchInput');
  const result = document.getElementById('liResult');
  const noResult = document.getElementById('liNoResult');
  const loader = document.getElementById('liLoader');
  const pager = document.getElementById('liPager');
  let keyword = '';
  let timer = null;

  // 调用搜索接口分页查询，渲染结果与分页条
  function doSearch(kw, targetPage) {
    keyword = (kw || '').trim();
    if (!keyword) {
      result.innerHTML = ''; pager.innerHTML = '';
      noResult.classList.add('li-hidden');
      return;
    }
    loader.classList.remove('li-hidden');
    LI.searchProducts({ kw: keyword, page: targetPage || 1, size: 8 }).then(function (data) {
      loader.classList.add('li-hidden');
      if (!data.total) {
        result.innerHTML = ''; pager.innerHTML = '';
        noResult.classList.remove('li-hidden');
        return;
      }
      noResult.classList.add('li-hidden');
      result.innerHTML = data.list.map(LI.prodCard).join('');
      data.list.forEach(function (p) { LI.refreshFavBtn(p.id); });
      LI.renderPager(pager, data, function (next) {
        doSearch(keyword, next);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }).catch(function (err) {
      console.error('[search.html] 搜索失败', err);
      loader.classList.add('li-hidden');
      result.innerHTML = '<div class="li-empty"><p>搜索失败，请稍后再试</p></div>';
    });
  }

  // 输入框防抖搜索
  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () { doSearch(input.value); }, 280);
  });

  // 热门关键词点击直接搜索
  document.querySelectorAll('[data-word]').forEach(function (b) {
    b.addEventListener('click', function () {
      input.value = b.dataset.word;
      doSearch(b.dataset.word);
    });
  });
})();
</script>
</body>
</html>
