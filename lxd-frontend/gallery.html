  功能名称：图文作品列表页，展示后端接口地址并从 lxd_gallery 表读取图文数据
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图文作品列表 · 李兴达</title>
  <link rel="stylesheet" href="css/lxd_index.css">
  <link rel="stylesheet" href="css/lxd_gallery.css">
</head>
<body class="lxd_gl-body">
  <main class="lxd_gl-page">
    <a class="lxd_db-back" href="index.html">← 返回首页</a>

    <header class="lxd_gl-head">
      <p class="lxd_eyebrow">MYSQL · GALLERY</p>
      <h1 class="lxd_db-title">光影瞬间 · 图文列表</h1>
      <p class="lxd_db-sub">图文数据存放在 MySQL 表 <code>lxd_gallery</code>，配图为本地生成的 SVG 插图。</p>
    </header>

    <section class="lxd_nw-api">
      <span class="lxd_nw-api-method">GET</span>
      <a class="lxd_nw-api-url" id="lxd_gl_api_url" href="/api/gallery/list" target="_blank" rel="noopener">/api/gallery/list</a>
      <p class="lxd_nw-api-tip">点击链接可在新标签查看接口返回的 JSON；支持参数 <code>?keyword=雪山&amp;category=自然</code>。</p>
    </section>

    <div class="lxd_nw-toolbar">
      <input class="lxd_db-input" id="lxd_gl_search" type="search" placeholder="搜索标题或配文，如：樱花">
      <div class="lxd_nw-tags" id="lxd_gl_tags">
        <button class="lxd_nw-tag lxd_on" type="button" data-category="">全部</button>
        <button class="lxd_nw-tag" type="button" data-category="城市">城市</button>
        <button class="lxd_nw-tag" type="button" data-category="自然">自然</button>
        <button class="lxd_nw-tag" type="button" data-category="人文">人文</button>
      </div>
    </div>

    <p class="lxd_nw-status" id="lxd_gl_status">正在加载图文…</p>
    <div class="lxd_gl-grid" id="lxd_gl_grid"></div>

    <footer class="lxd_footer">
      <span>© 2026 李兴达</span>
      <span>24002120311</span>
    </footer>
  </main>

  <script src="js/lxd_gallery.js"></script>
</body>
</html>
